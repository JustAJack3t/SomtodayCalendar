<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login HwCalendar</title>
    <link rel="stylesheet" href="styles/login.css">
    <link rel="icon" type="png" href="assets/logo.png">

</head>
<body>

    <!-- Login box -->
     <div id="loginBox" class="loginBox">
    
        <div id="infoContainer">
            <h1 class="loginText">Sign In</h1>
            <p id="loginInfo" class="loginText">Sign Into Your HwCalendar Account</p>
        </div>
        
        <div id="inputContainer">
            <input type="email" class="inputBox" id="eMail" placeholder="E-mailaddress">
            <input type="password" class="inputBox" id="password" placeholder="Password">
        </div>

        <button id="loginButton">Sign In</button>

        <div id="linkContainer">
            <span>Forgot your password? <a href="reset.html">Reset Password</a></span>
            <span>Don't have an account? <a href="register.html">Create One</a></span>
        </div>

     </div>

</body>
</html>
