<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login HwCalendar</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="icon" type="png" href="assets/logo.png">

</head>
<body>
    
    <!-- Animation box -->
    <div class="loadingAnimationBox">
        <div class="loadingBar" id="loadingBar"></div>
    </div>

    <!-- Login box -->
    <div class="mainBox">
    
        <div class="infoContainer">
            <h1 class="loginText">Sign In</h1>
            <p id="loginInfo" class="loginText">Sign Into Your HwCalendar Account</p>
        </div>
        
        <div class="inputContainer">
            <input type="email" class="inputBox" id="eMailInput" placeholder="E-mailaddress">
            <input type="password" class="inputBox" id="passwordInput" placeholder="Password">
        </div>

        <p class="errorMessage" id="errorMessage"></p>

        <button id="loginButton">Sign In</button>

        <div id="linkContainer">
            <span>Forgot your password? <a href="reset.html">Reset Password</a></span>
            <span>Don't have an account? <a href="register.html">Create One</a></span>
        </div>

    </div>

</body>
<script src="scripts/login.js"></script>
</html>
