<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register HwCalendar</title>
    <link rel="stylesheet" href="styles/register.css">
    <link rel="icon" type="png" href="assets/logo.png">

</head>
<body>
    
    <!-- Register Box -->
     <div class="loginBox">

        <div id="infoContainer">
            <h1 class="registerText">Create Account</h1>
            <p id="loginInfo" class="loginText">Create Your HwCalendar Account</p>
        </div>
        
        <div id="inputContainer">
            <input type="text" class="inputBox" id="firstName" placeholder="First Name">
            <input type="text" class="inputBox" id="lastName" placeholder="Last Name">
            <input type="email" class="inputBox" id="eMail" placeholder="E-mailadress">
            <input type="password" class="inputBox" id="password" placeholder="Password">
        </div>

        <button id="createButton">Create Account</button>

        <div id="linkContainer">
            <span>Already have an account? <a href="login.html">Login</a></span>
        </div>

     </div>

</body>
</html>
