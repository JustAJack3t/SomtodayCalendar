<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register HwCalendar</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="png" href="assets/logo.png">

</head>
<body>
    
    <div class="loadingAnimationBox">
        <div class="loadingBar" id="loadingBar"></div>
    </div>

    <!-- Register Box -->
     <div class="mainBox registerBox">

        <div id="infoContainer">
            <h1 class="registerText">Create Account</h1>
            <p id="loginInfo" class="loginText">Create Your HwCalendar Account</p>
        </div>
        
        <div class="inputContainer registerInputContainer">
            <input type="text" class="inputBox registerInputBox" id="firstNameInput" placeholder="First Name">
            <input type="text" class="inputBox registerInputBox" id="lastNameInput" placeholder="Last Name">
            <input type="email" class="inputBox registerInputBox" id="eMailInput" placeholder="E-mailaddress">
            <input type="password" class="inputBox registerInputBox" id="passwordInput" placeholder="Password">
        </div>

        <p class="errorMessage" id="errorMessage"></p>

        <button id="createButton">Create Account</button>

        <div id="linkContainer">
            <span>Already have an account? <a href="login.html">Login</a></span>
        </div>

     </div>

</body>
<script src="scripts/register.js"></script>
</html>
