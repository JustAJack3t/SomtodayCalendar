<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home HwCalendar</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="icon" type="png" href="assets/logo.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&icon_names=home,calendar_month,settings" />

</head>
<body>
    
    <!-- NAVBAR -->
    <div class="navbar">
        <button class="navbarButton" id="navbarCalendar"><span class="material-symbols-rounded">calendar_month</span><h3>Calendar</h3></button>
        <button class="navbarButton" id="navbarHome"><span class="material-symbols-rounded">home</span><h3>Home</h3></button>
        <button class="navbarButton" id="navbarSettings"><span class="material-symbols-rounded" id="settings">settings</span><h3>Settings</h3></button>
    </div>


    <!-- MAIN CONTAINER -->
    <div class="container">

        <div class="infoContainer">
            <h1 class="infoText" id="greetText"></h1>
        </div>

        <!-- ALL INFO ABOUT HOMEWORK -->
        <div class="hwInfoContainer">

            <!-- HOMEWORK DUE TOMORROW -->
            <div class="hwTomorrowContainer homepageBox">
                <h2>Tomorrow:</h2>
            </div>

            <!-- A PROGRESS BAR/GRAPH FOR CURRENT WEEKS HOMEWORK-->
            <div class="hwProgressContainer homepageBox">
                <h2>Weekly Progress:</h2>
            </div>

            <!-- HOMEWORK THATS OVERDUE-->
            <div class="hwOverdueContainer homepageBox">
                <h2>Over Due:</h2>
            </div>

        </div>

    </div>

</body>
<script src="scripts/home.js"></script>
</html>
